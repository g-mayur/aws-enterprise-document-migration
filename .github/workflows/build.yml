name: Java Build and Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      dynamodb-local:
        image: amazon/dynamodb-local:2.5.2
        ports:
          - 8000:8000
      s3-localstack:
        image: localstack/localstack:3.8.1
        env:
          SERVICES: s3
          DEFAULT_REGION: us-east-1
        ports:
          - 4566:4566

    env:
      DYNAMODB_LOCAL_ENDPOINT: http://localhost:8000
      S3_INTEGRATION_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: application/pom.xml

      - name: Run repository local validation
        run: bash scripts/local-validate.sh
