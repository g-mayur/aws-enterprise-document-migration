name: Deployment Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "application/**"
      - "infrastructure/**"
      - "scripts/**"
      - "docs/deployment-validation.md"
      - ".github/workflows/deployment-validation.yml"
  push:
    branches: [main]
    paths:
      - "application/**"
      - "infrastructure/**"
      - "scripts/**"
      - "docs/deployment-validation.md"
      - ".github/workflows/deployment-validation.yml"

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform -chdir=infrastructure fmt -check -diff -recursive

      - name: Initialize workload providers without backend
        run: terraform -chdir=infrastructure init -backend=false -input=false

      - name: Validate workload configuration
        run: terraform -chdir=infrastructure validate -no-color

      - name: Initialize bootstrap providers without backend
        run: terraform -chdir=infrastructure/bootstrap init -backend=false -input=false

      - name: Validate bootstrap configuration
        run: terraform -chdir=infrastructure/bootstrap validate -no-color

  preflight-script:
    name: Deployment preflight script checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check shell syntax and help output
        run: |
          bash -n scripts/deployment-preflight.sh
          bash scripts/deployment-preflight.sh --help

  container:
    name: Build worker container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build worker image
        run: docker build --pull --file application/Dockerfile --tag document-migration-worker:ci application
