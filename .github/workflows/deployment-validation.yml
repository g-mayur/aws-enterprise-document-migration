name: Deployment Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'application/**'
      - 'infrastructure/**'
      - 'scripts/**'
      - 'docs/deployment-validation.md'
      - '.github/workflows/deployment-validation.yml'
  push:
    branches: [main]
    paths:
      - 'application/**'
      - 'infrastructure/**'
      - 'scripts/**'
      - 'docs/deployment-validation.md'
      - '.github/workflows/deployment-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.9.8'

      - name: Check Terraform formatting
        run: terraform -chdir=infrastructure fmt -check -recursive

      - name: Validate Terraform stacks
        run: |
          terraform -chdir=infrastructure/bootstrap init -backend=false
          terraform -chdir=infrastructure/bootstrap validate
          terraform -chdir=infrastructure init -backend=false
          terraform -chdir=infrastructure validate

      - name: Check shell scripts
        run: |
          bash -n scripts/deployment-preflight.sh
          bash -n scripts/local-validate.sh
          bash scripts/deployment-preflight.sh --help

      - name: Build worker image
        run: docker build -f application/Dockerfile -t document-migration-worker:ci application
