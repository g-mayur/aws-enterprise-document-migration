<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1240" viewBox="0 0 1920 1240" role="img" aria-labelledby="t d">
<title id="t">Integrity verification and resumable multipart upload</title><desc id="d">A large readable flow shows source streaming, local staging and streaming SHA-256, a decision at 64 MiB for single PUT or sequential multipart upload, S3 destination, DynamoDB lease-bound checkpoints, and a three-step restart recovery sequence.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071421"/><stop offset="1" stop-color="#102c45"/></linearGradient><linearGradient id="card" x2="0" y2="1"><stop stop-color="#193950"/><stop offset="1" stop-color="#112a40"/></linearGradient><filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".3"/></filter><marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#50c9ec"/></marker>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f5f8fb}.eyebrow{font-size:20px;font-weight:700;letter-spacing:4px;fill:#ffba4d}.title{font-size:48px;font-weight:750}.subtitle{font-size:24px;fill:#aac0d3}.head{font-size:31px;font-weight:700}.body{font-size:23px;fill:#d0dce7}.muted{font-size:20px;fill:#9fb4c7}.tag{font-size:17px;letter-spacing:1.7px;font-weight:700;fill:#ffbd58}.card{fill:url(#card);stroke:#31516b;stroke-width:2}.flow{stroke:#50c9ec;stroke-width:5;fill:none;marker-end:url(#arrow)}.checkpoint{stroke:#b99fff;stroke-width:4;stroke-dasharray:12 10;fill:none}</style>
</defs>
<rect width="1920" height="1240" rx="34" fill="url(#bg)"/><circle cx="1745" cy="95" r="280" fill="#1b4e70" opacity=".12"/>
<text x="100" y="94" class="eyebrow">DATA INTEGRITY  /  RESUMABLE TRANSFER</text><text x="100" y="170" class="title">Verify content. Recover large transfers.</text><text x="100" y="216" class="subtitle">A readable view of checksum verification, S3 upload strategy and persisted recovery state</text>
<g filter="url(#shadow)"><rect x="100" y="300" width="350" height="245" rx="26" class="card"/><rect x="540" y="300" width="390" height="245" rx="26" class="card"/><rect x="1050" y="275" width="440" height="295" rx="26" fill="#1b3041" stroke="#df9229" stroke-width="3"/><rect x="1610" y="300" width="230" height="245" rx="26" class="card"/></g>
<text x="145" y="355" class="tag">01  /  INPUT</text><text x="145" y="415" class="head">Source stream</text><text x="145" y="475" class="body">Read document bytes</text><text x="145" y="515" class="muted">Connector + metadata</text>
<text x="585" y="355" class="tag">02  /  VALIDATE</text><text x="585" y="415" class="head">Stage &amp; verify</text><text x="585" y="475" class="body">Temporary disk staging</text><text x="585" y="515" class="muted">Size + streaming SHA-256</text>
<text x="1100" y="330" class="tag">03  /  TRANSFER STRATEGY</text><text x="1100" y="385" class="head">S3 destination writer</text><rect x="1100" y="420" width="340" height="60" rx="14" fill="#214359" stroke="#4b8ca8" stroke-width="2"/><text x="1125" y="459" class="body">≤ 64 MiB</text><text x="1415" y="459" text-anchor="end" font-size="22" font-weight="700" fill="#79dfbb">Single PUT</text><rect x="1100" y="495" width="340" height="52" rx="14" fill="#49371f" stroke="#b77b2d" stroke-width="2"/><text x="1125" y="530" class="body">&gt; 64 MiB</text><text x="1415" y="530" text-anchor="end" font-size="22" font-weight="700" fill="#ffc36b">Multipart</text>
<text x="1650" y="355" class="tag">04 / STORE</text><text x="1650" y="415" class="head">Amazon S3</text><text x="1650" y="475" class="body">Object key</text><text x="1650" y="515" class="muted">SSE-S3</text>
<path d="M450 425H530" class="flow"/><path d="M930 425H1040" class="flow"/><path d="M1490 425H1600" class="flow"/>
<g filter="url(#shadow)"><rect x="540" y="680" width="950" height="180" rx="26" class="card"/></g><circle cx="625" cy="770" r="42" fill="#3b3157"/><ellipse cx="625" cy="753" rx="23" ry="9" fill="none" stroke="#cbb6ff" stroke-width="4"/><path d="M602 753v34c0 17 46 17 46 0v-34M602 770c0 17 46 17 46 0" fill="none" stroke="#cbb6ff" stroke-width="4"/><text x="710" y="750" class="head">DynamoDB checkpoint state</text><text x="710" y="797" class="body">Active document lease · uploaded-part checkpoint · fencing token</text><text x="710" y="835" class="muted">Persisted recovery data is associated with the active document lease.</text><path d="M1270 570V630H1000V670" class="checkpoint"/><path d="M1000 860V900" class="checkpoint"/>
<text x="100" y="940" class="tag">AFTER A WORKER RESTART</text>
<g filter="url(#shadow)"><rect x="100" y="980" width="520" height="170" rx="24" class="card"/><rect x="700" y="980" width="520" height="170" rx="24" class="card"/><rect x="1300" y="980" width="520" height="170" rx="24" class="card"/></g>
<circle cx="165" cy="1040" r="31" fill="#3b3157"/><text x="165" y="1050" text-anchor="middle" font-size="27" font-weight="800" fill="#d0bdff">1</text><text x="220" y="1048" class="head">Load checkpoint</text><text x="145" y="1110" class="muted">Read persisted lease and part state.</text>
<circle cx="765" cy="1040" r="31" fill="#3b3157"/><text x="765" y="1050" text-anchor="middle" font-size="27" font-weight="800" fill="#d0bdff">2</text><text x="820" y="1048" class="head">Reconcile S3 parts</text><text x="745" y="1110" class="muted">Compare saved state with uploaded parts.</text>
<circle cx="1365" cy="1040" r="31" fill="#17433d"/><text x="1365" y="1050" text-anchor="middle" font-size="27" font-weight="800" fill="#8ce8c9">3</text><text x="1420" y="1048" class="head">Resume eligible work</text><text x="1345" y="1110" class="muted">Continue or report the exact outcome.</text>
<path d="M620 1065H690" class="flow"/><path d="M1220 1065H1290" class="flow"/>
<text x="100" y="1200" class="muted">The CLI stages each document locally and spools multipart data one part at a time. Provide sufficient ephemeral disk; validate resume behavior in the target AWS environment.</text>
</svg>