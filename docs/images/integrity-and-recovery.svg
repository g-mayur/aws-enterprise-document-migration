<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
<title id="title">Integrity verification and resumable multipart recovery</title><desc id="desc">Document content is staged and checksummed. Files up to 64 MiB use a single PutObject; larger files use sequential multipart upload. Multipart upload checkpoints are stored in DynamoDB under the active document lease. After a restart, the writer reconciles persisted checkpoint data with uploaded S3 parts before resuming.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#102a43"/></linearGradient><linearGradient id="panel" x2="0" y2="1"><stop stop-color="#19364f"/><stop offset="1" stop-color="#10263b"/></linearGradient><linearGradient id="gold"><stop stop-color="#ffc35e"/><stop offset="1" stop-color="#ee8b16"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".3"/></filter>
 <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#55c9e9"/></marker>
 <style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f4f7fb}.eyebrow{font-size:16px;letter-spacing:4px;font-weight:700;fill:#ffb547}.title{font-size:39px;font-weight:700}.sub{font-size:19px;fill:#a5b9cb}.h{font-size:22px;font-weight:700}.body{font-size:17px;fill:#c4d4e2}.small{font-size:14px;fill:#91a9bf}.label{font-size:13px;letter-spacing:1.5px;font-weight:700;fill:#ffbd58}.card{fill:url(#panel);stroke:#2c4b66;stroke-width:1.5}.line{fill:none;stroke:#55c9e9;stroke-width:3;marker-end:url(#arr)}.state{fill:none;stroke:#b49aff;stroke-width:2.5;stroke-dasharray:8 8}.icon{fill:none;stroke:#ffbd58;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style>
</defs>
<rect width="1600" height="920" rx="30" fill="url(#bg)"/><circle cx="1420" cy="90" r="220" fill="#19476b" opacity=".13"/>
<text x="76" y="72" class="eyebrow">DATA INTEGRITY  /  RECOVERY DESIGN</text><text x="76" y="132" class="title">Verify every document. Make large transfers recoverable.</text><text x="76" y="172" class="sub">A bounded-memory transfer path with persisted multipart checkpoints and lease-fenced state.</text>
<!-- main transfer row -->
<g filter="url(#shadow)"><rect x="76" y="250" width="270" height="190" rx="22" class="card"/><rect x="420" y="250" width="310" height="190" rx="22" class="card"/><rect x="804" y="220" width="360" height="250" rx="22" fill="#192e40" stroke="#e99a28" stroke-width="2"/><rect x="1238" y="250" width="286" height="190" rx="22" class="card"/></g>
<!-- source -->
<circle cx="130" cy="306" r="25" fill="#49351f"/><path d="M118 299h24v20h-24zM122 293h16v6h-16zM123 305h14M123 312h10" class="icon"/>
<text x="174" y="313" class="h">Source stream</text><text x="108" y="365" class="body">Read document bytes</text><text x="108" y="394" class="body">and source metadata</text>
<!-- staging -->
<circle cx="474" cy="306" r="25" fill="#49351f"/><path d="M461 296h26v22h-26zM467 302h14M467 309h14" class="icon"/>
<text x="518" y="313" class="h">Stage &amp; verify</text><text x="452" y="365" class="body">Temporary disk staging</text><text x="452" y="394" class="body">Size + streaming SHA-256</text>
<!-- writer -->
<text x="840" y="265" class="label">TRANSFER DECISION</text><text x="840" y="305" class="h">S3 destination writer</text>
<rect x="840" y="330" width="288" height="52" rx="12" fill="#203f55" stroke="#4b8ca8"/><text x="858" y="362" class="body">≤ 64 MiB</text><text x="1110" y="362" text-anchor="end" font-size="16" font-weight="700" fill="#70d6b3">Single PUT</text>
<rect x="840" y="395" width="288" height="52" rx="12" fill="#40311f" stroke="#b77b2d"/><text x="858" y="427" class="body">&gt; 64 MiB</text><text x="1110" y="427" text-anchor="end" font-size="16" font-weight="700" fill="#ffbf63">Multipart</text>
<!-- destination -->
<circle cx="1292" cy="306" r="25" fill="#153f3b"/><path d="M1280 300h24v20h-24zM1280 300l12-7 12 7M1286 308h12" fill="none" stroke="#61d6ae" stroke-width="3" stroke-linejoin="round"/>
<text x="1336" y="313" class="h">Amazon S3</text><text x="1270" y="365" class="body">Object + deterministic key</text><text x="1270" y="394" class="body">SSE-S3 configured</text>
<path d="M346 345H410" class="line"/><path d="M730 345H794" class="line"/><path d="M1164 345H1228" class="line"/>
<!-- checkpoint state -->
<g filter="url(#shadow)"><rect x="420" y="545" width="744" height="160" rx="22" class="card"/></g>
<circle cx="480" cy="610" r="28" fill="#302b4d"/><ellipse cx="480" cy="600" rx="14" ry="5" fill="none" stroke="#c7adff" stroke-width="2.5"/><path d="M466 600v20c0 8 28 8 28 0v-20M466 610c0 8 28 8 28 0" fill="none" stroke="#c7adff" stroke-width="2.5"/>
<text x="530" y="602" class="h">DynamoDB checkpoint state</text><text x="530" y="638" class="body">Active document lease · uploaded-part checkpoint · fencing token</text><text x="530" y="671" class="small">Checkpoint persistence is scoped to the active document lease.</text>
<path d="M984 470V515H800V535" class="state"/>
<!-- restart and reconciliation -->
<g filter="url(#shadow)"><rect x="1238" y="545" width="286" height="160" rx="22" class="card"/></g>
<circle cx="1290" cy="601" r="25" fill="#203b55"/><path d="M1278 603a13 13 0 1 0 4-10M1278 592v9h9" fill="none" stroke="#79c9f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1332" y="608" class="h">Worker restart</text><text x="1270" y="657" class="body">Resume path</text><text x="1270" y="682" class="small">Reconcile S3 uploaded parts</text>
<path d="M1164 625H1228" class="state"/>
<!-- lower sequence -->
<rect x="76" y="770" width="1448" height="90" rx="18" fill="#102239" stroke="#304b64"/>
<text x="110" y="807" class="label">RECOVERY SEQUENCE</text>
<text x="110" y="838" class="body">Load persisted checkpoint</text><path d="M360 824h65" class="line"/>
<text x="445" y="838" class="body">Reconcile against S3 parts</text><path d="M720 824h65" class="line"/>
<text x="805" y="838" class="body">Resume eligible parts</text><path d="M1045 824h65" class="line"/>
<text x="1130" y="838" class="body">Complete or report outcome</text>
<text x="76" y="895" class="small">IMPLEMENTATION NOTE  •  The CLI stages each document locally; the multipart writer spools one part at a time. Provision sufficient ephemeral disk. Resume must be validated in the target AWS environment.</text>
</svg>