<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="t d"><title id="t">Integrity and resumable upload flow</title><desc id="d">A worker reads a source document, stages it to temporary disk for size and checksum verification, writes to S3 using a single PUT or sequential multipart upload, stores multipart checkpoints with DynamoDB lease state, and reconciles uploaded parts after restart.</desc><defs><linearGradient id="b"><stop stop-color="#071629"/><stop offset="1" stop-color="#173b59"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47c7ee"/></marker><style>text{font-family:Arial,sans-serif;fill:#f5f9ff}.head{font-size:34px;font-weight:bold}.h{font-size:22px;font-weight:bold}.s{font-size:17px;fill:#c3d6e7}.box{fill:#102f4c;stroke:#40bced;stroke-width:2}.line{stroke:#47c7ee;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1400" height="560" rx="26" fill="url(#b)"/><text x="65" y="75" class="head">Integrity checks and resumable S3 transfer</text><rect class="box" x="65" y="185" width="230" height="175" rx="18"/><text class="h" x="180" y="235" text-anchor="middle">Read source</text><text class="s" x="180" y="280" text-anchor="middle">Connector stream</text><text class="s" x="180" y="310" text-anchor="middle">Document metadata</text><rect class="box" x="365" y="185" width="250" height="175" rx="18"/><text class="h" x="490" y="235" text-anchor="middle">Stage &amp; verify</text><text class="s" x="490" y="280" text-anchor="middle">Temporary disk</text><text class="s" x="490" y="310" text-anchor="middle">Size + SHA-256</text><rect x="685" y="160" width="280" height="225" rx="18" fill="#2a2a23" stroke="#fbbf24" stroke-width="2"/><text class="h" x="825" y="210" text-anchor="middle">S3 destination writer</text><text class="s" x="825" y="255" text-anchor="middle">Up to 64 MiB: single PUT</text><path d="M725 280H925" stroke="#e8b44d" stroke-width="1.5"/><text class="s" x="825" y="320" text-anchor="middle">Above threshold:</text><text class="s" x="825" y="350" text-anchor="middle">sequential multipart</text><rect x="1055" y="185" width="280" height="175" rx="18" fill="#123d38" stroke="#34d399" stroke-width="2"/><text class="h" x="1195" y="235" text-anchor="middle">Amazon S3 object</text><text class="s" x="1195" y="280" text-anchor="middle">Deterministic key</text><text class="s" x="1195" y="310" text-anchor="middle">SSE-S3 configured</text><path class="line" d="M295 270H355M615 270H675M965 270H1045"/><rect x="445" y="435" width="510" height="85" rx="16" fill="#241f3c" stroke="#a78bfa" stroke-width="2"/><text class="h" x="700" y="470" text-anchor="middle">DynamoDB recovery state</text><text class="s" x="700" y="500" text-anchor="middle">Active document lease • uploaded-part checkpoint • fencing</text><path d="M825 385V420H700V425" stroke="#b69cff" stroke-width="3" fill="none" stroke-dasharray="8 6"/><path d="M955 478H1010V390H825V385" stroke="#b69cff" stroke-width="3" fill="none" stroke-dasharray="8 6"/><text x="65" y="545" font-size="15" fill="#9db5ca">Temporary disk capacity must cover the current staged document / multipart part. Resume reconciles checkpoint data with S3 uploaded parts.</text></svg>