<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc"><title id="title">AWS Enterprise Document Migration architecture</title><desc id="desc">Source systems flow through connector discovery and JSONL manifests to ECS Fargate workers. Workers verify SHA-256 and transfer documents to S3. DynamoDB stores state and checkpoints, and Step Functions orchestrates workflow.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071629"/><stop offset="1" stop-color="#102c49"/></linearGradient><linearGradient id="blue"><stop stop-color="#123c65"/><stop offset="1" stop-color="#0b2744"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4cc9f0"/></marker><style>text{font-family:Arial,sans-serif;fill:#f4f8fc}.h{font-size:27px;font-weight:bold}.s{font-size:19px;fill:#c6d7e8}.tiny{font-size:15px;fill:#c6d7e8}.card{fill:url(#blue);stroke:#39bdf8;stroke-width:2}.line{stroke:#4cc9f0;stroke-width:4;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1400" height="650" rx="28" fill="url(#bg)"/><text x="70" y="72" font-size="18" letter-spacing="4" fill="#ffb02e" font-weight="bold">REFERENCE ARCHITECTURE</text><text x="70" y="120" font-size="38" font-weight="bold">AWS Enterprise Document Migration</text><rect class="card" x="60" y="235" width="245" height="180" rx="20"/><text class="h" x="182" y="285" text-anchor="middle">Source systems</text><text class="s" x="182" y="330" text-anchor="middle">Filesystem</text><text class="s" x="182" y="362" text-anchor="middle">Amazon S3</text><text class="tiny" x="182" y="393" text-anchor="middle">Custom connectors</text><rect class="card" x="375" y="235" width="245" height="180" rx="20"/><text class="h" x="497" y="285" text-anchor="middle">Discovery</text><text class="s" x="497" y="330" text-anchor="middle">Connector SPI</text><text class="s" x="497" y="362" text-anchor="middle">JSONL manifest</text><text class="tiny" x="497" y="393" text-anchor="middle">Manifest shards</text><rect x="695" y="205" width="300" height="240" rx="22" fill="#071d32" stroke="#ffad27" stroke-width="3"/><text class="h" x="845" y="255" text-anchor="middle">Migration workers</text><text x="845" y="292" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffbd55">Amazon ECS / Fargate</text><text class="s" x="845" y="337" text-anchor="middle">Stream document content</text><text class="s" x="845" y="371" text-anchor="middle">Calculate / verify SHA-256</text><text class="s" x="845" y="405" text-anchor="middle">Write deterministic S3 keys</text><rect class="card" x="1070" y="235" width="260" height="180" rx="20"/><text class="h" x="1200" y="285" text-anchor="middle">Destination</text><text x="1200" y="330" text-anchor="middle" font-size="19" fill="#ffbd55">Amazon S3</text><text class="s" x="1200" y="365" text-anchor="middle">Encrypted objects</text><text class="tiny" x="1200" y="395" text-anchor="middle">Version policy applies</text><path class="line" d="M305 325H365M620 325H685M995 325H1060"/><rect x="520" y="500" width="360" height="105" rx="18" fill="#142f4c" stroke="#a78bfa" stroke-width="2"/><text class="h" x="700" y="542" text-anchor="middle">Amazon DynamoDB</text><text class="tiny" x="700" y="575" text-anchor="middle">Migration state • leases • checkpoints</text><path d="M845 445V480H700V490" stroke="#b69cff" stroke-width="3" fill="none" stroke-dasharray="8 7"/><rect x="1000" y="500" width="330" height="105" rx="18" fill="#142f4c" stroke="#f472b6" stroke-width="2"/><text class="h" x="1165" y="542" text-anchor="middle">AWS Step Functions</text><text class="tiny" x="1165" y="575" text-anchor="middle">Workflow orchestration</text><path d="M995 245V185H1165V490" stroke="#f472b6" stroke-width="3" fill="none" stroke-dasharray="8 7"/><text x="70" y="625" font-size="15" fill="#9db5ca">Conceptual view • AWS deployment and production validation require a separately configured target environment.</text></svg>