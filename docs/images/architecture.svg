<title id="t">AWS Enterprise Document Migration architecture</title><desc id="d">A clearly grouped architecture showing sources and connector discovery, JSONL manifests stored in S3, Step Functions orchestration, ECS Fargate workers, S3 destination, DynamoDB migration state, and CloudWatch visibility.</desc>
