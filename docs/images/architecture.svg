<text x="76" y="132" class="headline">A controlled pipeline for enterprise document migration</text>
<text x="76" y="171" class="sub">Connector-led discovery · manifest-driven execution · verifiable S3 delivery · durable recovery state</text>
<text x="78" y="236" class="section">SOURCE &amp; PREPARATION</text><text x="650" y="236" class="section">ORCHESTRATION &amp; TRANSFER</text><text x="1280" y="236" class="section">DESTINATION</text>
