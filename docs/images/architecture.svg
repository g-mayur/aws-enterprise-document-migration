<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
<title id="title">AWS Enterprise Document Migration — reference architecture</title><desc id="desc">Enterprise architecture showing source connectors and discovery, JSONL manifest shards, Step Functions orchestration, ECS Fargate migration workers, Amazon S3 destination, DynamoDB state and checkpoints, and CloudWatch operational visibility.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071321"/><stop offset=".55" stop-color="#0b1d31"/><stop offset="1" stop-color="#102941"/></linearGradient>
 <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#172f47"/><stop offset="1" stop-color="#10243a"/></linearGradient>
 <linearGradient id="orange" x2="1" y2="1"><stop stop-color="#ffbd58"/><stop offset="1" stop-color="#f28c00"/></linearGradient>
 <linearGradient id="cyan" x2="1" y2="0"><stop stop-color="#42d5f5"/><stop offset="1" stop-color="#2587d8"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity=".32"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#53c9ec"/></marker>
 <style>
 text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f4f7fb}.eyebrow{font-size:17px;letter-spacing:4px;font-weight:700;fill:#ffb547}.headline{font-size:39px;font-weight:700;letter-spacing:-.6px}.sub{font-size:19px;fill:#9fb4c8}.section{font-size:14px;letter-spacing:2.5px;font-weight:700;fill:#91a9bf}.card{fill:url(#panel);stroke:#29445f;stroke-width:1.5}.cardtitle{font-size:23px;font-weight:700}.body{font-size:17px;fill:#c5d3e0}.small{font-size:14px;fill:#91a9bf}.pill{font-size:13px;font-weight:700;letter-spacing:1px}.flow{fill:none;stroke:#53c9ec;stroke-width:3;marker-end:url(#arr)}.dash{fill:none;stroke:#a78bfa;stroke-width:2.5;stroke-dasharray:8 8}.iconstroke{fill:none;stroke:#ffb547;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
 </style>
</defs>
