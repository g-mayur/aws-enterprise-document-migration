<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Document migration lifecycle</title><desc id="desc">Six phases: discover source, prepare and validate JSONL manifest, partition work, execute bounded workers, verify and write destination, then reconcile job state. Failure and recovery are explicit operator-controlled paths.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#102a43"/></linearGradient><linearGradient id="card" x2="0" y2="1"><stop stop-color="#19354e"/><stop offset="1" stop-color="#11283e"/></linearGradient><linearGradient id="accent"><stop stop-color="#ffc15a"/><stop offset="1" stop-color="#ed8a12"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".3"/></filter>
 <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#55c9e9"/></marker>
 <style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f4f7fb}.eyebrow{font-size:16px;letter-spacing:4px;font-weight:700;fill:#ffb547}.title{font-size:40px;font-weight:700}.subtitle{font-size:19px;fill:#a5b9cb}.phase{font-size:14px;letter-spacing:2px;font-weight:700;fill:#ffbd58}.h{font-size:22px;font-weight:700}.body{font-size:17px;fill:#c2d2e0}.micro{font-size:14px;fill:#91a9bf}.card{fill:url(#card);stroke:#2b4964;stroke-width:1.5}.line{stroke:#55c9e9;stroke-width:3;fill:none;marker-end:url(#arr)}.icon{fill:none;stroke:#ffbd58;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style>
</defs>
<rect width="1600" height="900" rx="30" fill="url(#bg)"/><circle cx="1450" cy="100" r="230" fill="#1d5273" opacity=".12"/>
<text x="76" y="72" class="eyebrow">PROCESS VIEW  /  DOCUMENT JOURNEY</text><text x="76" y="132" class="title">A deliberate path from discovery to verified delivery</text><text x="76" y="172" class="subtitle">Separate inventory from transfer. Keep execution bounded. Persist state so outcomes can be inspected and reconciled.</text>
<!-- cards row -->
<g filter="url(#shadow)"><rect x="76" y="255" width="430" height="205" rx="22" class="card"/><rect x="585" y="255" width="430" height="205" rx="22" class="card"/><rect x="1094" y="255" width="430" height="205" rx="22" class="card"/>
<rect x="76" y="520" width="430" height="205" rx="22" class="card"/><rect x="585" y="520" width="430" height="205" rx="22" class="card"/><rect x="1094" y="520" width="430" height="205" rx="22" class="card"/></g>
<!-- 1 -->
<circle cx="130" cy="312" r="28" fill="#49351f"/><path d="M117 309h26v20h-26zM121 302h18v7h-18zM122 315h16M122 321h12" class="icon"/>
<text x="178" y="306" class="phase">01  /  INVENTORY</text><text x="178" y="342" class="h">Discover source content</text><text x="112" y="392" class="body">Connector reads documents, metadata,</text><text x="112" y="420" class="body">and available source versions.</text>
<!-- 2 -->
<circle cx="639" cy="312" r="28" fill="#49351f"/><path d="M628 298h18l8 8v22h-26zM646 298v9h8M633 315h14M633 322h14" class="icon"/>
<text x="687" y="306" class="phase">02  /  MANIFEST</text><text x="687" y="342" class="h">Prepare and validate</text><text x="621" y="392" class="body">Build JSONL records with explicit version</text><text x="621" y="420" class="body">semantics; validate before execution.</text>
<!-- 3 -->
<circle cx="1148" cy="312" r="28" fill="#49351f"/><path d="M1135 302h26v7h-26zM1135 313h26v7h-26zM1135 324h26v7h-26z" class="icon"/>
<text x="1196" y="306" class="phase">03  /  PARTITION</text><text x="1196" y="342" class="h">Create bounded work</text><text x="1130" y="392" class="body">Shard manifests and assign controlled</text><text x="1130" y="420" class="body">units of work to migration workers.</text>
<!-- 4 -->
<circle cx="130" cy="577" r="28" fill="#49351f"/><path d="M117 565h26v25h-26zM112 571h5M143 571h5M112 581h5M143 581h5M125 560v5M135 560v5" class="icon"/>
<text x="178" y="571" class="phase">04  /  EXECUTE</text><text x="178" y="607" class="h">Stream and process</text><text x="112" y="657" class="body">Workers stage content to temporary disk</text><text x="112" y="685" class="body">and calculate SHA-256 checksums.</text>
<!-- 5 -->
<circle cx="639" cy="577" r="28" fill="#153f3b"/><path d="M626 568h26v22h-26zM626 568l13-8 13 8M633 578h12M633 584h12" fill="none" stroke="#61d6ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="687" y="571" class="phase">05  /  DELIVER</text><text x="687" y="607" class="h">Write destination objects</text><text x="621" y="657" class="body">Apply deterministic keys and transfer</text><text x="621" y="685" class="body">content to Amazon S3.</text>
<!-- 6 -->
<circle cx="1148" cy="577" r="28" fill="#26395b"/><path d="M1135 579l9 9 18-21" fill="none" stroke="#a9baff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1196" y="571" class="phase">06  /  RECONCILE</text><text x="1196" y="607" class="h">Commit and inspect state</text><text x="1130" y="657" class="body">Persist outcomes; inspect failed work</text><text x="1130" y="685" class="body">and reconcile exact executions.</text>
<!-- connectors serpentine -->
<path d="M506 355H575" class="line"/><path d="M1015 355H1084" class="line"/><path d="M1310 460V510" class="line"/><path d="M1094 620H1025" class="line"/><path d="M585 620H516" class="line"/>
<!-- footer band -->
<rect x="76" y="778" width="1448" height="76" rx="18" fill="#102239" stroke="#304b64"/>
<circle cx="118" cy="816" r="17" fill="#3c2c4d"/><path d="M118 805v12l9 5" fill="none" stroke="#c5a5ff" stroke-width="2.5" stroke-linecap="round"/>
<text x="151" y="810" font-size="17" font-weight="700">Recovery is an explicit operator workflow</text><text x="151" y="835" class="micro">The current foreground controller requires confirmation, applies execution ceilings, and reconciles each execution; it is not an unattended scheduler.</text>
<text x="76" y="883" class="micro">PROCESS REPRESENTATION  •  Actual runtime behavior depends on source connector capabilities and target AWS configuration.</text>
</svg>