<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="t d"><title id="t">Document migration lifecycle</title><desc id="d">Discover documents, prepare and validate JSONL manifests, assign bounded worker execution, transfer and verify content, persist state, and reconcile outcomes.</desc><defs><linearGradient id="b"><stop stop-color="#06182b"/><stop offset="1" stop-color="#123657"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#39c6ee"/></marker><style>text{font-family:Arial,sans-serif;fill:#f5f9ff}.head{font-size:34px;font-weight:bold}.num{font-size:18px;font-weight:bold;fill:#ffbb48}.h{font-size:22px;font-weight:bold}.s{font-size:17px;fill:#bfd1e2}.box{fill:#103354;stroke:#38bdf8;stroke-width:2}.arr{stroke:#39c6ee;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1400" height="560" rx="26" fill="url(#b)"/><text x="65" y="75" class="head">From source discovery to verified destination</text><rect class="box" x="55" y="175" width="190" height="205" rx="18"/><text class="num" x="80" y="215">01</text><text class="h" x="150" y="265" text-anchor="middle">Discover</text><text class="s" x="150" y="310" text-anchor="middle">Read source</text><text class="s" x="150" y="340" text-anchor="middle">metadata &amp; versions</text><rect class="box" x="285" y="175" width="190" height="205" rx="18"/><text class="num" x="310" y="215">02</text><text class="h" x="380" y="265" text-anchor="middle">Prepare</text><text class="s" x="380" y="310" text-anchor="middle">JSONL manifest</text><text class="s" x="380" y="340" text-anchor="middle">Validate &amp; shard</text><rect class="box" x="515" y="175" width="190" height="205" rx="18"/><text class="num" x="540" y="215">03</text><text class="h" x="610" y="265" text-anchor="middle">Assign</text><text class="s" x="610" y="310" text-anchor="middle">Bounded worker</text><text class="s" x="610" y="340" text-anchor="middle">execution</text><rect x="745" y="175" width="190" height="205" rx="18" fill="#2d2a21" stroke="#ffad27" stroke-width="2"/><text class="num" x="770" y="215">04</text><text class="h" x="840" y="265" text-anchor="middle">Transfer</text><text class="s" x="840" y="310" text-anchor="middle">Stream content</text><text class="s" x="840" y="340" text-anchor="middle">SHA-256 + S3</text><rect class="box" x="975" y="175" width="190" height="205" rx="18"/><text class="num" x="1000" y="215">05</text><text class="h" x="1070" y="265" text-anchor="middle">Commit</text><text class="s" x="1070" y="310" text-anchor="middle">Persist status</text><text class="s" x="1070" y="340" text-anchor="middle">and lease state</text><rect x="1205" y="175" width="150" height="205" rx="18" fill="#123d38" stroke="#34d399" stroke-width="2"/><text class="num" x="1228" y="215">06</text><text class="h" x="1280" y="265" text-anchor="middle">Verify</text><text class="s" x="1280" y="310" text-anchor="middle">Reconcile</text><text class="s" x="1280" y="340" text-anchor="middle">outcomes</text><path class="arr" d="M245 280H275M475 280H505M705 280H735M935 280H965M1165 280H1195"/><path d="M1280 390V455H840V390" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#a)"/><text x="1055" y="490" text-anchor="middle" font-size="18" fill="#ffd18a">Failure path: inspect state, reconcile, resume from checkpoint when eligible</text><text x="65" y="530" font-size="15" fill="#9db5ca">The recovery controller is explicitly invoked; this diagram does not imply an unattended scheduler.</text></svg>