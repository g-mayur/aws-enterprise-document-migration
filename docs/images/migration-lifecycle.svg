<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1180" viewBox="0 0 1920 1180" role="img" aria-labelledby="t d">
<title id="t">End-to-end document migration lifecycle</title><desc id="d">Six numbered steps in a spacious two-row process: discover, prepare manifest, partition work, execute, deliver, and reconcile. A separate recovery lane explains explicit operator-led recovery.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071421"/><stop offset="1" stop-color="#102c45"/></linearGradient><linearGradient id="card" x2="0" y2="1"><stop stop-color="#193950"/><stop offset="1" stop-color="#112a40"/></linearGradient><filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".3"/></filter><marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#50c9ec"/></marker>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f5f8fb}.eyebrow{font-size:20px;font-weight:700;letter-spacing:4px;fill:#ffba4d}.title{font-size:48px;font-weight:750}.subtitle{font-size:24px;fill:#aac0d3}.num{font-size:24px;font-weight:800;fill:#ffbd58}.step{font-size:30px;font-weight:700}.body{font-size:22px;fill:#d0dce7}.muted{font-size:19px;fill:#9fb4c7}.card{fill:url(#card);stroke:#31516b;stroke-width:2}.flow{stroke:#50c9ec;stroke-width:5;fill:none;marker-end:url(#arrow)}</style>
</defs>
<rect width="1920" height="1180" rx="34" fill="url(#bg)"/><circle cx="1740" cy="95" r="270" fill="#1b4e70" opacity=".12"/>
<text x="100" y="94" class="eyebrow">PROCESS OVERVIEW  /  V0.1.0</text><text x="100" y="170" class="title">The document migration journey</text><text x="100" y="216" class="subtitle">Six understandable stages — from source inventory to verified destination state</text>
<g filter="url(#shadow)"><rect x="100" y="310" width="520" height="260" rx="26" class="card"/><rect x="700" y="310" width="520" height="260" rx="26" class="card"/><rect x="1300" y="310" width="520" height="260" rx="26" class="card"/><rect x="100" y="650" width="520" height="260" rx="26" class="card"/><rect x="700" y="650" width="520" height="260" rx="26" class="card"/><rect x="1300" y="650" width="520" height="260" rx="26" class="card"/></g>
<circle cx="165" cy="382" r="34" fill="#47351f"/><text x="165" y="391" text-anchor="middle" class="num">01</text><text x="225" y="393" class="step">Discover</text><text x="150" y="475" class="body">Read source documents and metadata.</text><text x="150" y="515" class="muted">Filesystem · Amazon S3 · connector SPI</text>
<circle cx="765" cy="382" r="34" fill="#47351f"/><text x="765" y="391" text-anchor="middle" class="num">02</text><text x="825" y="393" class="step">Prepare manifest</text><text x="750" y="475" class="body">Build JSONL records and validate versions.</text><text x="750" y="515" class="muted">Explicit LATEST_ONLY / ALL_VERSIONS policy</text>
<circle cx="1365" cy="382" r="34" fill="#47351f"/><text x="1365" y="391" text-anchor="middle" class="num">03</text><text x="1425" y="393" class="step">Partition work</text><text x="1350" y="475" class="body">Shard manifests into bounded work units.</text><text x="1350" y="515" class="muted">Prepared input for worker execution</text>
<circle cx="165" cy="722" r="34" fill="#47351f"/><text x="165" y="731" text-anchor="middle" class="num">04</text><text x="225" y="733" class="step">Execute</text><text x="150" y="815" class="body">Stream content and calculate SHA-256.</text><text x="150" y="855" class="muted">ECS / Fargate · temporary disk staging</text>
<circle cx="765" cy="722" r="34" fill="#17433d"/><text x="765" y="731" text-anchor="middle" class="num">05</text><text x="825" y="733" class="step">Deliver</text><text x="750" y="815" class="body">Write objects using deterministic keys.</text><text x="750" y="855" class="muted">Amazon S3 · single PUT or multipart upload</text>
<circle cx="1365" cy="722" r="34" fill="#293b5d"/><path d="M1350 722l11 11 21-25" fill="none" stroke="#b4c3ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1425" y="733" class="step">Reconcile</text><text x="1350" y="815" class="body">Persist outcomes and inspect failed work.</text><text x="1350" y="855" class="muted">Migration state · exact execution status</text>
<path d="M620 440H680" class="flow"/><path d="M1220 440H1280" class="flow"/><path d="M1560 570V635" class="flow"/><path d="M1300 780H1240" class="flow"/><path d="M700 780H640" class="flow"/>
<rect x="100" y="970" width="1720" height="135" rx="24" fill="#171f38" stroke="#8067b7" stroke-width="2"/><circle cx="165" cy="1037" r="32" fill="#3b3157"/><path d="M151 1038a15 15 0 1 0 5-11M151 1024v12h12" fill="none" stroke="#c5adff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="225" y="1025" class="step">Recovery is a deliberate operator action</text><text x="225" y="1065" class="body">Load saved checkpoints → reconcile S3 parts and execution state → resume eligible work → report outcome.</text>
<text x="100" y="1150" class="muted">The current foreground recovery controller requires explicit confirmation and execution ceilings; unattended scheduling is not included.</text>
</svg>